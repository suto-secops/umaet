<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d99f3"/>
      <stop offset="100%" stop-color="#0e569e"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#27ae60"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1c40f"/>
      <stop offset="100%" stop-color="#f39c12"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="12" y="12" width="104" height="104" rx="24" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Wallet / Pocket Shape -->
  <rect x="26" y="38" width="76" height="56" rx="10" fill="#ffffff" fill-opacity="0.15"/>
  <rect x="26" y="44" width="76" height="50" rx="8" fill="#ffffff" fill-opacity="0.95" filter="url(#shadow)"/>

  <!-- Wallet Band / Flap -->
  <path d="M 26,54 L 102,54" stroke="#dcdfe3" stroke-width="2"/>

  <!-- Gold Coin Rising -->
  <circle cx="64" cy="40" r="16" fill="url(#coinGrad)" filter="url(#shadow)"/>
  <circle cx="64" cy="40" r="13" fill="none" stroke="#fef9e7" stroke-width="1.5" stroke-dasharray="2,2"/>
  <text x="64" y="46" font-family="sans-serif" font-size="16" font-weight="bold" fill="#7d4e00" text-anchor="middle">€</text>

  <!-- Wallet Clasp / Badge -->
  <rect x="80" y="62" width="22" height="16" rx="5" fill="url(#cardGrad)" filter="url(#shadow)"/>
  <circle cx="87" cy="70" r="3" fill="#ffffff"/>

  <!-- Decorative Chart Sparklines inside wallet -->
  <path d="M 36,80 L 48,72 L 58,76 L 72,64" fill="none" stroke="#27ae60" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
